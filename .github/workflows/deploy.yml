name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # PRのCIを通って自動マージされた変更はworkflow_dispatchで届くので、再テストしない。
  # mainへの手動マージや直接pushのときだけテストする。
  test:
    if: github.event_name == 'push'
    # 呼び出し先のmergeジョブ（pushでは実行されない）が宣言する権限の上限を満たすために必要
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/ci.yml

  deploy:
    name: GitHub Pagesへ公開
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
